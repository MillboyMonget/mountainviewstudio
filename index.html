<!doctype html><html><head><meta charset="utf-8"><title>Mountain View Studio</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#1b1d21;color:#e8e6e1;font:13px -apple-system,system-ui,sans-serif}
header{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#25282d;border-bottom:1px solid #353941;-webkit-app-region:drag;flex-wrap:wrap}
header>*{-webkit-app-region:no-drag}header i{width:1px;height:20px;background:#444}
button,select,input{font:inherit;color:inherit;background:#32363d;border:1px solid #444a53;border-radius:6px;padding:5px 9px}
button:hover{background:#3d424b}button.on{background:#d9a56c;color:#1b1d21;border-color:#d9a56c}
main{flex:1;display:flex;min-height:0}#cv{flex:1;min-width:0}canvas{display:block}
aside{width:230px;overflow:auto;padding:10px;background:#25282d}#list{width:170px;border-right:1px solid #353941;padding:6px}#insp{border-left:1px solid #353941}
#list div{padding:4px 8px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#list div:hover{background:#32363d}#list div.on{background:#d9a56c;color:#1b1d21}
h4{margin:12px 0 4px;font-size:11px;color:#d9a56c;text-transform:uppercase;letter-spacing:.06em}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
aside input{width:100%;padding:4px}input[type=color]{padding:0;height:28px}.row{display:flex;gap:6px;margin-top:12px}.row button{flex:1}
</style></head><body>
<header><button id="open">Open</button><button id="save">Save</button>
<select id="exp"><option value="">Export…</option><option value="glb">GLB — Blender, Unity, Unreal</option><option value="obj">OBJ — SketchUp, Rhino, 3ds Max, Blender</option><option value="stl">STL — 3D printing</option><option value="usdz">USDZ — Apple Quick Look / Reality Composer</option></select><i></i>
<button id="undo">↶</button><button id="redo">↷</button><i></i>
<button data-add="box">＋ Box</button><button data-add="cylinder">＋ Cylinder</button><button data-add="sphere">＋ Sphere</button><i></i>
<button data-m="translate" class="on">Move (G)</button><button data-m="rotate">Rotate (R)</button><button data-m="scale">Scale (S)</button><button id="snap" class="on">Snap</button><i></i><button id="start">Mountain View starter</button></header>
<main><aside id="list"></aside><div id="cv"></div>
<aside id="insp" hidden>
<h4>Name</h4><input data-k="n">
<h4>Position (m)</h4><div class="g"><input data-k="px" type="number" step=".1"><input data-k="py" type="number" step=".1"><input data-k="pz" type="number" step=".1"></div>
<h4>Size (m)</h4><div class="g"><input data-k="sx" type="number" step=".1"><input data-k="sy" type="number" step=".1"><input data-k="sz" type="number" step=".1"></div>
<h4>Rotation (°)</h4><div class="g"><input data-k="rx" type="number" step="5"><input data-k="ry" type="number" step="5"><input data-k="rz" type="number" step="5"></div>
<h4>Color · Opacity · Roughness</h4><div class="g"><input data-k="c" type="color"><input data-k="o" type="number" min="0" max="1" step=".05"><input data-k="ro" type="number" min="0" max="1" step=".1"></div>
<h4>Extend a face by (m, negative shrinks)</h4><input id="ext" type="number" value="1" step=".1" style="margin-bottom:5px">
<div class="g"><button data-e="x,1">+X</button><button data-e="y,1">+Y</button><button data-e="z,1">+Z</button><button data-e="x,-1">−X</button><button data-e="y,-1">−Y</button><button data-e="z,-1">−Z</button></div>
<h4>Array copies · count, dx, dy, dz</h4><div class="g4"><input id="an" type="number" value="3"><input id="ax" type="number" value="1.5" step=".1"><input id="ay" type="number" value="0" step=".1"><input id="az" type="number" value="0" step=".1"></div>
<div class="row"><button id="arr">Make array</button></div>
<div class="row"><button id="dup">Duplicate ⌘D</button><button id="del">Delete ⌫</button></div>
</aside></main>
<script type="module" src="renderer.js"></script></body></html>
